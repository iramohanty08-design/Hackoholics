<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillBridge Assistant</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: sticky profile/progress rail on the left, conversation on the right; stacks on phones. */
:root{
  --bg:#F5F7FD; --surface:#FFFFFF; --ink:#0D1633; --muted:#5A6482; --line:#DDE3F3;
  --accent:#1F3FBF; --accent-ink:#FFFFFF; --tint:#E8EDFF; --good:#157347; --good-bg:#E3F4EA;
  --f-display:'Space Grotesk',system-ui,sans-serif; --f-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0F20; --surface:#121A36; --ink:#EAEEFC; --muted:#9AA5C8; --line:#25305A;
  --accent:#7C97FF; --accent-ink:#0A0F20; --tint:#1B2650; --good:#6FD39A; --good-bg:#12301F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0F20; --surface:#121A36; --ink:#EAEEFC; --muted:#9AA5C8; --line:#25305A;
  --accent:#7C97FF; --accent-ink:#0A0F20; --tint:#1B2650; --good:#6FD39A; --good-bg:#12301F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:var(--f-display);font-size:26px;margin:0;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.flow{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}.rail{order:2}}
.rail{display:grid;gap:14px;position:sticky;top:12px}
@media(max-width:820px){.rail{position:static}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h2{font-family:var(--f-display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--tint);color:var(--accent);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:500}
.chip.hit{background:var(--good-bg);color:var(--good)}
.empty{color:var(--muted);font-size:13px;margin:0}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.metric b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums;color:var(--accent)}
.metric small{color:var(--muted);font-size:12px}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13px}
.hist li{border-left:3px solid var(--accent);padding-left:8px}
.hist em{color:var(--muted);font-style:normal;display:block}
.chat{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;height:min(78vh,720px);min-height:480px}
.log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 13px;border-radius:12px;overflow-wrap:anywhere}
.msg.bot{background:var(--tint);align-self:flex-start;border-bottom-left-radius:3px}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:3px}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px;margin-top:8px;color:var(--ink)}
.card h3{font-family:var(--f-display);font-size:15px;margin:0}
.card .org{color:var(--muted);font-size:13px;margin-bottom:6px}
.card .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.score{font-family:var(--f-display);font-weight:700;color:var(--accent);margin-left:auto;font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:600;font-size:13px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
.btn.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.quick button{font:inherit;font-size:13px;background:var(--surface);color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
input{flex:1;min-width:0;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:12px;color:var(--muted)}
.dots span{display:inline-block;width:6px;height:6px;margin-right:3px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.dots span{animation:none}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Skill<span>Bridge</span> Assistant</h1>
    <div class="flow">SKILLS &rarr; SERVICE &rarr; GROWTH</div>
  </header>
  <div class="grid">
    <aside class="rail">
      <div class="panel"><h2>Your skill profile</h2><div id="profile"></div></div>
      <div class="panel"><h2>Success measures</h2><div class="metrics" id="metrics"></div></div>
      <div class="panel"><h2>Contribution history</h2><ul class="hist" id="hist"></ul></div>
      <p class="note">Opportunities shown are sample data for the demo. Your session lives in this page only.</p>
    </aside>
    <section class="chat" aria-label="Chat with SkillBridge">
      <div class="log" id="log" aria-live="polite"></div>
      <div class="quick" id="quick"></div>
      <form id="form"><input id="msg" autocomplete="off" placeholder="Tell me what you can do, e.g. I know Python and design posters" aria-label="Message"><button class="btn" type="submit">Send</button></form>
    </section>
  </div>
</div>

<script>
const SKILLS={
 'Web Design':['web design','website','websites','html','css','ui','ux','figma'],
 'Programming':['python','coding','programming','javascript','developer','software','java','react','app development'],
 'Graphic Design':['graphic design','poster','posters','canva','photoshop','logo','illustration'],
 'Teaching':['teach','teaching','tutor','tutoring','mentor','mentoring','coaching','maths','math'],
 'Data Analysis':['excel','data','analysis','analytics','sql','spreadsheet','dashboard','power bi'],
 'Writing':['writing','write','content','blog','copywriting','editing','editor'],
 'Social Media':['social media','instagram','marketing','campaign','campaigns'],
 'Photography':['photo','photos','photography','videography','video'],
 'Event Planning':['event','events','organising','organizing','coordination','logistics'],
 'First Aid':['first aid','nursing','nurse','medical','health','cpr'],
 'Translation':['translate','translation','translating','hindi','tamil','telugu','bilingual'],
 'Public Speaking':['public speaking','speaking','debate','emcee','presenting'],
 'Fundraising':['fundraising','fundraiser','donations','grant','grants'],
 'Counselling':['counselling','counseling','listening','mental health']
};
const CITIES=['Chennai','Bengaluru','Delhi','Mumbai','Hyderabad','Pune','Kolkata','Remote'];
let nextId=9;
const opps=[
 {id:1,title:'Website for a community food bank',org:'Annapurna Food Bank',loc:'Chennai',skills:['Web Design','Programming'],hrs:12},
 {id:2,title:'Weekend maths tutoring for Class 8',org:'Learn Together Trust',loc:'Bengaluru',skills:['Teaching'],hrs:8},
 {id:3,title:'Fundraiser poster and social posts',org:'Clean Rivers Collective',loc:'Remote',skills:['Graphic Design','Social Media'],hrs:6},
 {id:4,title:'Village health camp volunteer',org:'Asha Health Mission',loc:'Delhi',skills:['First Aid','Event Planning'],hrs:10},
 {id:5,title:'Donor data dashboard',org:'Hope Kids Foundation',loc:'Remote',skills:['Data Analysis'],hrs:10},
 {id:6,title:'Translate safety leaflets',org:'Safe Homes Network',loc:'Mumbai',skills:['Translation','Writing'],hrs:5},
 {id:7,title:'Photograph the tree plantation drive',org:'Green Chennai',loc:'Chennai',skills:['Photography','Social Media'],hrs:3},
 {id:8,title:'Youth public speaking workshop',org:'Voice Up Youth',loc:'Remote',skills:['Public Speaking','Teaching'],hrs:6}
];
const S={name:'',skills:[],loc:'',applied:{},done:[],learning:[],flow:null,awaitLearn:null,lastShown:[]};

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has=(l,k)=>new RegExp('\\b'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(l);
function extractSkills(t){const l=t.toLowerCase();return Object.keys(SKILLS).filter(n=>SKILLS[n].some(k=>has(l,k)));}
function extractCity(t){const l=t.toLowerCase();return CITIES.find(c=>l.includes(c.toLowerCase()))||'';}

function addMsg(who,html){const d=document.createElement('div');d.className='msg '+who;d.innerHTML=html;$('log').appendChild(d);$('log').scrollTop=1e9;return d;}
function say(html,quick){
  const t=addMsg('bot','<span class="dots"><span></span><span></span><span></span></span>');
  setTimeout(()=>{t.innerHTML=html;setQuick(quick||defaultQuick());$('log').scrollTop=1e9;},380);
}
function defaultQuick(){
  if(!S.skills.length)return['I know Python and web design','I can teach maths and speak Hindi','I do photography and social media'];
  return['Find opportunities for me','Show my progress','I want to post an opportunity','Add more skills'];
}
function setQuick(a){$('quick').innerHTML=a.map(x=>`<button type="button" data-send="${esc(x)}">${esc(x)}</button>`).join('');}

function score(o){
  const m=o.skills.filter(s=>S.skills.includes(s));
  const locOk=!S.loc||o.loc==='Remote'||o.loc===S.loc;
  return {o,m,pct:Math.round(m.length/o.skills.length*100),locOk};
}
function matches(){
  return opps.map(score).filter(r=>r.m.length&&!S.applied[r.o.id]&&!S.done.some(d=>d.id===r.o.id))
    .sort((a,b)=>(b.locOk-a.locOk)||(b.pct-a.pct)||(b.m.length-a.m.length)).slice(0,4);
}
function oppCard(r){
  const o=r.o;
  return `<div class="card"><h3>${esc(o.title)}</h3><div class="org">${esc(o.org)} &middot; ${esc(o.loc)} &middot; ~${o.hrs} hrs</div>
  <div class="chips">${o.skills.map(s=>`<span class="chip ${r.m.includes(s)?'hit':''}">${esc(s)}</span>`).join('')}</div>
  <div class="row"><button class="btn" data-apply="${o.id}">Apply</button>
  <span class="score">${r.pct}% match</span></div>
  <div class="note" style="margin-top:6px">You cover ${r.m.length} of ${o.skills.length} needed skills (${esc(r.m.join(', '))}).${r.locOk?'':' Location is outside '+esc(S.loc)+'.'}</div></div>`;
}
function showMatches(){
  if(!S.skills.length){say('I need to know your skills first. What can you do? Mention a few, like <b>Python</b>, <b>teaching</b> or <b>poster design</b>.');return;}
  const m=matches();
  S.lastShown=m.map(r=>r.o.id);
  if(!m.length){say('No open opportunities match your current skills'+(S.loc?' in '+esc(S.loc):'')+'. Add more skills, or check back after NGOs post new roles.');return;}
  say(`<p>Here ${m.length>1?'are your top '+m.length+' matches':'is your best match'}${S.loc?' near '+esc(S.loc)+' or remote':''}:</p>`+m.map(oppCard).join('')+'<p style="margin-top:8px">Apply to one and I will track it for you.</p>',
    ['Show my progress','I want to post an opportunity','Add more skills']);
}
function apply(id){
  const o=opps.find(x=>x.id==id);if(!o||S.applied[id])return;
  S.applied[id]=true;render();
  say(`<p>You are now matched with <b>${esc(o.title)}</b> at ${esc(o.org)}. In a live version the organisation would get your profile and confirm.</p>
  <div class="card"><div class="row" style="margin:0"><button class="btn" data-done="${id}">Mark as completed</button></div></div>
  <p style="margin-top:8px">When the work is finished, press the button above or tell me "I finished it".</p>`,['Find opportunities for me','Show my progress']);
}
function complete(id){
  const o=opps.find(x=>x.id==id);
  if(!o||!S.applied[id]||S.done.some(d=>d.id===o.id))return;
  S.done.push({id:o.id,title:o.title,org:o.org,hrs:o.hrs,skills:o.skills,date:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'})});
  delete S.applied[id];S.awaitLearn=o.id;render();
  say(`<p>Recorded: <b>${esc(o.title)}</b>, about ${o.hrs} hours. Nice work.</p><p>What did you learn from it? One line is enough and I will add it to your learning record.</p>`,['Learned to work with a real client','Skip']);
}
function startPost(){S.flow={step:'title',d:{}};say('Great, let us post a role. <b>What does the project or volunteering role involve?</b> Give it a short title.',['Design a brochure for our shelter','Teach basic computers to seniors']);}
function flowStep(t){
  const f=S.flow;
  if(f.step==='title'){f.d.title=t.slice(0,80);f.step='skills';say('Which skills are needed? List a few, like "design, writing, social media".');return;}
  if(f.step==='skills'){const s=extractSkills(t);if(!s.length){say('I could not spot a skill there. Try words like <b>design</b>, <b>teaching</b>, <b>python</b>, <b>photography</b> or <b>fundraising</b>.');return;}f.d.skills=s;f.step='loc';say('Needed skills: '+s.map(x=>`<span class="chip">${esc(x)}</span>`).join(' ')+'<p style="margin-top:6px">Where is it? Pick a city or say remote.</p>',['Remote','Chennai','Bengaluru','Delhi']);return;}
  if(f.step==='loc'){f.d.loc=extractCity(t)||'Remote';f.step='hrs';say('Roughly how many hours of work is it?',['4','8','12']);return;}
  if(f.step==='hrs'){
    const n=parseInt(t.replace(/\D/g,''),10)||6;
    const o={id:nextId++,title:f.d.title,org:S.name?S.name+"'s organisation":'Your organisation',loc:f.d.loc,skills:f.d.skills,hrs:n};
    opps.push(o);S.flow=null;S.posted=(S.posted||0)+1;render();
    const people=S.skills.length&&o.skills.some(s=>S.skills.includes(s));
    say(`<p>Posted to the opportunity board.</p><div class="card"><h3>${esc(o.title)}</h3><div class="org">${esc(o.loc)} &middot; ~${o.hrs} hrs</div><div class="chips">${o.skills.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div></div>`+
      (people?'<p style="margin-top:8px">It also matches your own skills, so it will appear in your matches.</p>':''),['Find opportunities for me','Show my progress']);
  }
}
function progress(){
  const hrs=S.done.reduce((a,d)=>a+d.hrs,0);
  if(!S.skills.length&&!S.done.length){say('Nothing recorded yet. Tell me your skills to create your profile.');return;}
  say(`<p><b>${S.name?esc(S.name)+"'s":'Your'} journey so far</b></p>
  <p>Skills: ${S.skills.map(s=>`<span class="chip">${esc(s)}</span>`).join(' ')||'none yet'}</p>
  <p>Projects completed: <b>${S.done.length}</b> &middot; Hours contributed: <b>${hrs}</b> &middot; Learning notes: <b>${S.learning.length}</b></p>`+
  (S.done.length?'<p>Latest: '+esc(S.done[S.done.length-1].title)+'</p>':'<p>Apply to an opportunity to start your contribution history.</p>'),
  ['Find opportunities for me','Add more skills']);
}
function openApplied(){return opps.filter(o=>S.applied[o.id]);}

function handle(t){
  const l=t.toLowerCase().trim();
  if(S.flow){ if(/^(cancel|stop|never ?mind)/.test(l)){S.flow=null;say('Cancelled. What would you like to do next?');return;} flowStep(t);return;}
  if(S.awaitLearn){
    const id=S.awaitLearn;S.awaitLearn=null;
    if(!/^skip$/i.test(l)){S.learning.push({id,text:t});render();say('Added to your learning record. Want to see more opportunities?',['Find opportunities for me','Show my progress']);}
    else say('No problem. Want to see more opportunities?',['Find opportunities for me','Show my progress']);
    return;
  }
  const nm=t.match(/(?:my name is|call me)\s+([A-Za-z]+)/i);
  if(nm){S.name=nm[1][0].toUpperCase()+nm[1].slice(1);render();say(`Nice to meet you, ${esc(S.name)}. What skills can you offer?`);return;}
  if(/^(hi|hello|hey|namaste)\b/.test(l)){say('Hello! I help people turn their skills into community impact. What can you do? Mention a few skills and where you are.');return;}
  if(/(post|publish|add).*(opportunit|role|project|volunteer)|we need volunteers|i represent|our ngo/.test(l)){startPost();return;}
  if(/(finish|complet|done with|wrapped up)/.test(l)){
    const a=openApplied();
    if(!a.length){say('You have no active project to complete. Apply to one first.',['Find opportunities for me']);return;}
    if(a.length===1){complete(a[0].id);return;}
    say('Which one did you finish?'+a.map(o=>`<div class="card"><h3>${esc(o.title)}</h3><div class="row"><button class="btn" data-done="${o.id}">Mark as completed</button></div></div>`).join(''));return;
  }
  if(/(progress|history|record|my profile|summary|journey)/.test(l)){progress();return;}
  const c=extractCity(t);if(c&&c!=='Remote'){S.loc=c;}
  const sk=extractSkills(t);
  if(sk.length){
    const fresh=sk.filter(s=>!S.skills.includes(s));S.skills.push(...fresh);render();
    if(/learn/.test(l)&&S.done.length){S.learning.push({id:S.done[S.done.length-1].id,text:t});render();}
    say(`<p>${fresh.length?'Added to your profile: '+fresh.map(s=>`<span class="chip">${esc(s)}</span>`).join(' '):'Those are already on your profile.'}${c&&c!=='Remote'?'<br>Location set to <b>'+esc(c)+'</b>.':''}</p><p>Want me to find opportunities that fit?</p>`,['Find opportunities for me','Add more skills','Show my progress']);
    return;
  }
  if(/(find|match|opportunit|suggest|recommend|show|volunteer|project|what can i do|yes|sure|ok)/.test(l)){showMatches();return;}
  if(/(add more|more skills)/.test(l)){say('Sure. List more skills, or tell me your city so I can prioritise local roles.');return;}
  if(c){say(`Location set to <b>${esc(c)}</b>.`,['Find opportunities for me']);return;}
  say(`<p>I can help you:</p><p>&bull; build a skill profile<br>&bull; find matching volunteer roles<br>&bull; post a role as an NGO<br>&bull; track completed projects and learning</p><p>Try telling me your skills, for example "I know Excel and can teach maths in Chennai".</p>`);
}

function render(){
  $('profile').innerHTML=(S.name?`<p style="margin:0 0 8px"><b>${esc(S.name)}</b>${S.loc?' &middot; '+esc(S.loc):''}</p>`:S.loc?`<p style="margin:0 0 8px">${esc(S.loc)}</p>`:'')+
    (S.skills.length?`<div class="chips">${S.skills.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div>`:'<p class="empty">No skills yet. Tell the assistant what you can do.</p>');
  const m=[[S.skills.length?1:0,'Profiles created'],[opps.length,'Opportunities on board'],[Object.keys(S.applied).length+S.done.length,'Matches made'],[S.done.length,'Projects completed'],[S.learning.length,'Learning recorded'],[S.done.reduce((a,d)=>a+d.hrs,0),'Hours contributed']];
  $('metrics').innerHTML=m.map(x=>`<div class="metric"><b>${x[0]}</b><small>${x[1]}</small></div>`).join('');
  $('hist').innerHTML=S.done.length?S.done.slice().reverse().map(d=>{const ln=S.learning.find(x=>x.id===d.id);
    return `<li><b>${esc(d.title)}</b><em>${esc(d.org)} &middot; ${d.hrs} hrs &middot; ${esc(d.date)}</em>${ln?`<em>Learned: ${esc(ln.text)}</em>`:''}</li>`}).join(''):'<li class="empty" style="border:0;padding:0">Completed projects appear here.</li>';
}

$('form').addEventListener('submit',e=>{e.preventDefault();const v=$('msg').value.trim();if(!v)return;$('msg').value='';addMsg('me',esc(v));handle(v);});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.send){addMsg('me',esc(b.dataset.send));handle(b.dataset.send);}
  else if(b.dataset.apply){b.disabled=true;b.textContent='Applied';apply(b.dataset.apply);}
  else if(b.dataset.done){b.disabled=true;b.textContent='Completed';complete(b.dataset.done);}
});

render();
addMsg('bot','<p><b>Welcome to SkillBridge.</b> I connect what you can do with community projects that need it.</p><p>Tell me your skills and city, or say you are an NGO and want to post a role.</p>');
setQuick(defaultQuick());
</script>
</body>
</html>
